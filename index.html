<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Campeonato de Futebol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Inscrição para Campeonato de Futebol</h1>

<form action="https://webhook.site/seu-codigo-aqui" method="post">

    <fieldset>
        <legend>Dados do Jogador</legend>

        <p>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
        </p>

        <p>
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">
        </p>

        <p>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="10" max="60">
        </p>

    </fieldset>

    <fieldset>
        <legend>Informações do Campeonato</legend>

        <p>Posição em que joga:</p>

        <input type="radio" id="goleiro" name="posicao" value="Goleiro" required>
        <label for="goleiro">Goleiro</label><br>

        <input type="radio" id="zagueiro" name="posicao" value="Zagueiro">
        <label for="zagueiro">Zagueiro</label><br>

        <input type="radio" id="meio" name="posicao" value="Meio-campo">
        <label for="meio">Meio-campo</label><br>

        <input type="radio" id="atacante" name="posicao" value="Atacante">
        <label for="atacante">Atacante</label>

        <p>Dias disponíveis para jogar:</p>

        <input type="checkbox" id="sabado" name="dias" value="Sábado">
        <label for="sabado">Sábado</label><br>

        <input type="checkbox" id="domingo" name="dias" value="Domingo">
        <label for="domingo">Domingo</label><br>

        <input type="checkbox" id="feriado" name="dias" value="Feriado">
        <label for="feriado">Feriado</label>

        <p>
            <label for="time">Time Preferido:</label>
            <select id="time" name="time">
                <option value="flamengo">Flamengo</option>
                <option value="corinthians">Corinthians</option>
                <option value="palmeiras">Palmeiras</option>
                <option value="fluminense">Fluminense</option>
                <option value="outro">Outro</option>
            </select>
        </p>

        <p>
            <label for="nivel">Nível de habilidade:</label>
            <input type="range" id="nivel" name="nivel" min="1" max="10">
        </p>

        <p>
            <label for="cor">Cor do uniforme:</label>
            <input type="color" id="cor" name="cor">
        </p>

    </fieldset>

    <fieldset>
        <legend>Observações</legend>

        <label for="obs">Conte um pouco sobre sua experiência no futebol:</label><br>

        <textarea
            id="obs"
            name="observacoes"
            rows="5"
            cols="40"
            maxlength="300"
            placeholder="Escreva aqui..."></textarea>

    </fieldset>

    <br>

    <input type="submit" value="Enviar Inscrição">

</form>

</body>
</html>
